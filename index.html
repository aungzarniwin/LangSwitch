<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwiftLingo PRO - Focused & Categorized Edition</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.75);
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.4);
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --success: #22c55e;
      --error: #ef4444;
      --accent: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e1b4b, #0f172a);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .app-card {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    /* Top Stats Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .brand { font-size: 20px; font-weight: 800; color: #fff; }
    .brand span { color: var(--primary); }

    .streak-badge {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: var(--accent);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    /* Language Selection Grid */
    .lang-selector {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      background: rgba(15, 23, 42, 0.6);
      padding: 6px;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .lang-btn {
      padding: 8px 4px;
      border: none;
      background: transparent;
      color: var(--subtext);
      font-size: 11px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .lang-btn.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 0 12px var(--primary-glow);
    }

    /* Category Filter Pills */
    .category-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .category-bar::-webkit-scrollbar { display: none; }

    .cat-pill {
      white-space: nowrap;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: var(--subtext);
      cursor: pointer;
      transition: all 0.2s;
    }

    .cat-pill.active {
      background: rgba(59, 130, 246, 0.2);
      border-color: var(--primary);
      color: #fff;
    }

    /* Tabs */
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--subtext);
      font-weight: 700;
      font-size: 13px;
      border-radius: 12px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* Flashcard 3D Flip System */
    .flip-container {
      perspective: 1000px;
      height: 220px;
      margin-bottom: 16px;
    }

    .flipper {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .flipper.flipped { transform: rotateY(180deg); }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 18px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }

    .card-front {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.9));
    }

    .card-back {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.2), rgba(15, 23, 42, 0.9));
      transform: rotateY(180deg);
    }

    .badge-tag {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 2px 8px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--subtext);
    }

    .word-title { font-size: 32px; font-weight: 800; margin-bottom: 6px; }
    .word-phonetic { font-size: 14px; color: var(--subtext); }
    .word-meaning { font-size: 26px; font-weight: 800; color: #60a5fa; margin-bottom: 8px; }
    .flip-hint { font-size: 11px; color: var(--subtext); margin-top: 10px; opacity: 0.7; }

    /* Controls */
    .control-row { display: flex; gap: 10px; margin-bottom: 16px; }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.2s;
    }

    .btn-secondary { background: rgba(255, 255, 255, 0.08); color: #fff; }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 0 15px var(--primary-glow); }

    /* Progress Bar */
    .progress-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s;
    }

    /* Quiz Styles */
    .quiz-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      text-align: center;
      margin-bottom: 16px;
    }

    .quiz-options { display: flex; flex-direction: column; gap: 10px; }

    .option-btn {
      padding: 14px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text);
      border-radius: 12px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .option-btn.correct { background: rgba(34, 197, 94, 0.2) !important; border-color: var(--success) !important; color: var(--success) !important; }
    .option-btn.wrong { background: rgba(239, 68, 68, 0.2) !important; border-color: var(--error) !important; color: var(--error) !important; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="app-card">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand">⚡ Swift<span>PRO</span></div>
    <div class="streak-badge">🔥 Categorized Mode</div>
  </div>

  <!-- Target Language Selector -->
  <div class="lang-selector">
    <button class="lang-btn active" onclick="changeLang('en', this)">🇬🇧 EN</button>
    <button class="lang-btn" onclick="changeLang('zh', this)">🇨🇳 ZH</button>
    <button class="lang-btn" onclick="changeLang('ja', this)">🇯🇵 JA</button>
    <button class="lang-btn" onclick="changeLang('th', this)">🇹🇭 TH</button>
  </div>

  <!-- Category Filter Pills -->
  <div class="category-bar">
    <button class="cat-pill active" onclick="setCategory('all', this)">✨ All</button>
    <button class="cat-pill" onclick="setCategory('daily', this)">💬 Daily Life</button>
    <button class="cat-pill" onclick="setCategory('food', this)">🍜 Food & Dining</button>
    <button class="cat-pill" onclick="setCategory('travel', this)">✈️ Travel</button>
  </div>

  <!-- Navigation Tabs -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('learn', this)">📚 စာကျက်ရန်</button>
    <button class="tab-btn" onclick="switchTab('quiz', this)">🧠 ဉာဏ်စမ်းစမ်းရန်</button>
  </div>

  <!-- LEARN TAB -->
  <div id="learnTab">
    <div class="flip-container" onclick="flipCard()">
      <div class="flipper" id="flipper">
        <div class="card-front">
          <span class="badge-tag" id="catBadgeFront">daily</span>
          <div class="word-title" id="wordFront">-</div>
          <div class="word-phonetic" id="phoneticFront">-</div>
          <div class="flip-hint">👆 နှိပ်၍ မြန်မာအဓိပ္ပါယ်ကြည့်ပါ</div>
        </div>
        <div class="card-back">
          <span class="badge-tag" id="catBadgeBack">daily</span>
          <div class="word-meaning" id="meaningBack">-</div>
          <div class="word-phonetic" id="phoneticBack">-</div>
          <div class="flip-hint">👆 နှိပ်၍ မူလနေရာသို့ပြန်သွားပါ</div>
        </div>
      </div>
    </div>

    <div class="control-row">
      <button class="btn btn-secondary" onclick="speakAudio()">🔊 အသံဖွင့်ပါ</button>
      <button class="btn btn-primary" onclick="nextCard()">နောက်တစ်ခု →</button>
    </div>

    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="learnProgress"></div>
    </div>
  </div>

  <!-- QUIZ TAB -->
  <div id="quizTab" class="hidden">
    <div class="quiz-card">
      <div style="font-size: 12px; color: var(--subtext); margin-bottom: 4px;">အောက်ပါစာလုံး၏ မြန်မာဘာသာပြန်ကို ရွေးပါ:</div>
      <div style="font-size: 28px; font-weight: 800; color: var(--primary);" id="quizWord">-</div>
    </div>

    <div class="quiz-options" id="optionsGrid"></div>

    <button class="btn btn-primary hidden" id="nextQuizBtn" style="width: 100%; margin-top: 16px;" onclick="nextQuiz()">နောက်မေးခွန်းတစ်ခု →</button>
  </div>
</div>

<script>
  // Vocabulary Database
  const db = [
    {
      category: "daily",
      myanmar: "မင်္ဂလာပါ",
      en: { word: "Hello", phonetic: "ဟဲလို", code: "en-US" },
      zh: { word: "你好", phonetic: "Nǐ hǎo (နီဟောင်)", code: "zh-CN" },
      ja: { word: "こんにちは", phonetic: "Konnichiwa (ကွန်းနိချိဝါ)", code: "ja-JP" },
      th: { word: "สวัสดี", phonetic: "Sawasdee (ဆဝါဒီ)", code: "th-TH" }
    },
    {
      category: "daily",
      myanmar: "ကျေးဇူးတင်ပါတယ်။",
      en: { word: "Thank you", phonetic: "သန့်ခ်ယူ", code: "en-US" },
      zh: { word: "谢谢", phonetic: "Xièxie (ရှဲရှဲ)", code: "zh-CN" },
      ja: { word: "ありがとう", phonetic: "Arigatou (အရိဂါတိုး)", code: "ja-JP" },
      th: { word: "ขอบคุณ", phonetic: "Khob khun (ခေါပ်ခွန်း)", code: "th-TH" }
    },
    {
      category: "food",
      myanmar: "ဘေလ်ရှင်းမယ်",
      en: { word: "Check, please", phonetic: "ချက်ခ် ပလိစ်စ့်", code: "en-US" },
      zh: { word: "买单", phonetic: "Mǎi dān (မိုင်တန်း)", code: "zh-CN" },
      ja: { word: "お会計をお願いします", phonetic: "Okaikei o onegaishimasu (အိုကိုင်ကေး)", code: "ja-JP" },
      th: { word: "เก็บเงินด้วยครับ", phonetic: "Kep nguen duay khrap (ကပ်ပ်ငွန်း)", code: "th-TH" }
    },
    {
      category: "food",
      myanmar: "စားပြီးပြီလား?",
      en: { word: "Have you eaten?", phonetic: "ဟက်ဗ်ယူ အီးတန်", code: "en-US" },
      zh: { word: "吃了吗？", phonetic: "Chī le ma? (ချီးလမ)", code: "zh-CN" },
      ja: { word: "ご飯食べた？", phonetic: "Gohan tabeta? (ဂိုဟန်တာဘဲတ)", code: "ja-JP" },
      th: { word: "กินข้าวหรือยัง", phonetic: "Kin khaw rue yang (ကင်းခေါဝ်ရူယှမ်း)", code: "th-TH" }
    },
    {
      category: "food",
      myanmar: "ရေ",
      en: { word: "Water", phonetic: "ဝေါတား", code: "en-US" },
      zh: { word: "水", phonetic: "Shuǐ (ရှုဲလ်)", code: "zh-CN" },
      ja: { word: "水", phonetic: "Mizu (မိဇု)", code: "ja-JP" },
      th: { word: "น้ำ", phonetic: "Nam (နမ်း)", code: "th-TH" }
    },
    {
      category: "travel",
      myanmar: "ဘယ်လောက်လဲ?",
      en: { word: "How much?", phonetic: "ဟောက်မတ်ချ်", code: "en-US" },
      zh: { word: "多少钱？", phonetic: "Duōshǎo qián? (တိုရှောင်ချန်း)", code: "zh-CN" },
      ja: { word: "いくらですか？", phonetic: "Ikura desu ka? (အိခုရဒေ့စ်ခ)", code: "ja-JP" },
      th: { word: "เท่าไหร่", phonetic: "Thao rai? (ထောင်းရိုင်း)", code: "th-TH" }
    },
    {
      category: "travel",
      myanmar: "ဟိုတယ်",
      en: { word: "Hotel", phonetic: "ဟိုတယ်လ်", code: "en-US" },
      zh: { word: "酒店", phonetic: "Jiǔdiàn (ကျိုတျန့်)", code: "zh-CN" },
      ja: { word: "ホテル", phonetic: "Hoteru (ဟိုတဲရု)", code: "ja-JP" },
      th: { word: "โรงแรม", phonetic: "Rongraem (ရုန်းရမ်း)", code: "th-TH" }
    }
  ];

  let currentLang = 'en';
  let currentCategory = 'all';
  let activeList = [...db];
  let currentIndex = 0;
  let quizIndex = 0;
  let isAnswered = false;

  // Sound Synth via Web Audio API
  function playSound(type) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      if (type === 'correct') {
        osc.frequency.setValueAtTime(523.25, ctx.currentTime);
        osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } else {
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        osc.frequency.setValueAtTime(196, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      }
    } catch (e) {
      console.log('Audio error:', e);
    }
  }

  // Filter List by Category
  function updateActiveList() {
    if (currentCategory === 'all') {
      activeList = [...db];
    } else {
      activeList = db.filter(item => item.category === currentCategory);
    }
    currentIndex = 0;
    quizIndex = 0;
  }

  function setCategory(cat, el) {
    currentCategory = cat;
    document.querySelectorAll('.cat-pill').forEach(btn => btn.classList.remove('active'));
    el.classList.add('active');
    updateActiveList();
    renderLearnCard();
    resetQuiz();
  }

  function changeLang(lang, el) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
    el.classList.add('active');
    renderLearnCard();
    resetQuiz();
  }

  function switchTab(tab, el) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    el.classList.add('active');
    if (tab === 'learn') {
      document.getElementById('learnTab').classList.remove('hidden');
      document.getElementById('quizTab').classList.add('hidden');
    } else {
      document.getElementById('learnTab').classList.add('hidden');
      document.getElementById('quizTab').classList.remove('hidden');
      resetQuiz();
    }
  }

  function flipCard() {
    document.getElementById('flipper').classList.toggle('flipped');
  }

  function renderLearnCard() {
    document.getElementById('flipper').classList.remove('flipped');
    
    if (activeList.length === 0) return;

    const item = activeList[currentIndex];
    const data = item[currentLang];

    document.getElementById('wordFront').innerText = data.word;
    document.getElementById('phoneticFront').innerText = data.phonetic;
    document.getElementById('meaningBack').innerText = item.myanmar;
    document.getElementById('phoneticBack').innerText = data.phonetic;

    document.getElementById('catBadgeFront').innerText = item.category;
    document.getElementById('catBadgeBack').innerText = item.category;

    const progress = ((currentIndex + 1) / activeList.length) * 100;
    document.getElementById('learnProgress').style.width = `${progress}%`;
  }

  function nextCard() {
    if (activeList.length === 0) return;
    currentIndex = (currentIndex + 1) % activeList.length;
    renderLearnCard();
  }

  function speakAudio() {
    if (activeList.length === 0) return;
    const data = activeList[currentIndex][currentLang];
    const u = new SpeechSynthesisUtterance(data.word);
    u.lang = data.code;
    window.speechSynthesis.speak(u);
  }

  function resetQuiz() {
    quizIndex = 0;
    renderQuiz();
  }

  function renderQuiz() {
    isAnswered = false;
    document.getElementById('nextQuizBtn').classList.add('hidden');

    if (activeList.length === 0) return;

    const qData = activeList[quizIndex];
    document.getElementById('quizWord').innerText = qData[currentLang].word;

    const correct = qData.myanmar;
    let options = [correct];

    // Pick distractors from global db
    db.forEach((item) => {
      if (item.myanmar !== correct && !options.includes(item.myanmar)) {
        options.push(item.myanmar);
      }
    });

    options = options.slice(0, 4); // Max 4 options
    options.sort(() => Math.random() - 0.5);

    const container = document.getElementById('optionsGrid');
    container.innerHTML = options.map(opt => `
      <button class="option-btn" onclick="checkAnswer(this, '${opt}', '${correct}')">${opt}</button>
    `).join('');
  }

  function checkAnswer(btn, selected, correct) {
    if (isAnswered) return;
    isAnswered = true;

    if (selected === correct) {
      btn.classList.add('correct');
      playSound('correct');
    } else {
      btn.classList.add('wrong');
      playSound('wrong');
      document.querySelectorAll('.option-btn').forEach(b => {
        if (b.innerText === correct) b.classList.add('correct');
      });
    }
    document.getElementById('nextQuizBtn').classList.remove('hidden');
  }

  function nextQuiz() {
    if (activeList.length === 0) return;
    quizIndex = (quizIndex + 1) % activeList.length;
    renderQuiz();
  }

  // Initial Load
  updateActiveList();
  renderLearnCard();
</script>

</body>
</html>
